<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restitution de la Priorisation — FdR 2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <!-- EN-TÊTE PRINCIPAL -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 mb-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour à l'accueil
          </a>
          <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            🏆 Restitution des sujets priorisés
          </h1>
        </div>
        <div class="text-xs text-slate-500 font-medium">
          Résultats de la consultation FdR 2027
        </div>
      </div>

      <!-- ONGLETS DE SÉLECTION (3 CTA) -->
      <div class="flex items-center gap-2 mt-6 border-b border-slate-200 pb-2 overflow-x-auto">
        <button id="cta-MagasinsU" onclick="switchPerimeter('MagasinsU')" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-indigo-600 text-white border-indigo-600 shadow-xs">
          <i data-lucide="store" class="w-4 h-4"></i>
          Magasins U <span id="count-MagasinsU" class="px-2 py-0.5 text-xs rounded-full bg-white/20 text-white">0</span>
        </button>
        <button id="cta-CoursesU" onclick="switchPerimeter('CoursesU')" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-white text-slate-600 border-slate-200 hover:bg-slate-100">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          Courses U <span id="count-CoursesU" class="px-2 py-0.5 text-xs rounded-full bg-slate-100 text-slate-600">0</span>
        </button>
        <button id="cta-MeP" onclick="switchPerimeter('MeP')" class="tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-white text-slate-600 border-slate-200 hover:bg-slate-100">
          <i data-lucide="settings" class="w-4 h-4"></i>
          MeP (Exploitation & Productivité) <span id="count-MeP" class="px-2 py-0.5 text-xs rounded-full bg-slate-100 text-slate-600">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="cards-list" class="space-y-4"></div>
  </main>

  <script>
    const pollResults = {
      "MagasinsU": [
        { id: "mag-8", title: "Simplification et allègement du parcours d'inscription (profilage progressif)", category: "👋🏻Engagement client et acquisition", subCategory: "👨‍💻 ESC", description: "Alléger les formulaires d'inscription en ne demandant que le strict nécessaire au départ, puis proposer de compléter son profil au fil de l'eau.", gains: "Bénéfice client : création de compte plus rapide et fluide.\nBénéfice magasin : hausse du taux de conversion.", votes: 100, top1: 0, score: 175, businessNote: "10,90", originalScore: 100 },
        { id: "mag-5", title: "Espace Offres : Bouton d'achat direct « Acheter sur Courses U » sur les offres", category: "👋🏻Engagement client et acquisition", subCategory: "👨‍💻 ESC", description: "Permettre d'ajouter un produit directement au panier Courses U depuis l'Espace Offres de Magasins U.", gains: "Bénéfice client : passage fluide de l'offre à l'achat.\nBénéfice magasin : création de synergies entre les canaux.", votes: 100, top1: 0, score: 167, businessNote: "8,55", originalScore: 100 },
        { id: "mag-13", title: "Harmonisation des tuiles produit avec convergence MU et CU", category: "👋🏻Engagement client et acquisition", subCategory: "🖥️ Web, 📱 Apps", description: "Harmoniser la présentation des fiches et tuiles produits entre Magasins U et Courses U (Nutri-Score, origine France, pictos).", gains: "Bénéfice client : clarté et lisibilité sur tous les supports.\nBénéfice magasin : image unifiée et professionnelle.", votes: 83, top1: 0, score: 162, businessNote: "13,85", originalScore: 100 },
        { id: "mag-15", title: "Liste de courses issue du tract promotionnel", category: "👋🏻Engagement client et acquisition", subCategory: "🖥️ Web, 📱 Apps, 👨‍💻 ESC", description: "Générer une liste de courses personnalisée directement à partir des promotions sélectionnées dans les e-tracts.", gains: "Bénéfice client : préparation facile de ses achats malins.\nBénéfice magasin : meilleure transformation des opérations catalogue.", votes: 84, top1: 0, score: 155, businessNote: "13,75", originalScore: 100 },
        { id: "mag-10", title: "Centralisation et affichage des codes promo éligibles dans l'Espace Client", category: "👋🏻Engagement client et acquisition", subCategory: "👨‍💻 ESC", description: "Afficher l'ensemble des codes promotionnels actifs et éligibles directement dans le compte client.", gains: "Bénéfice client : ne rater aucune promotion active.\nBénéfice magasin : plus grande satisfaction client.", votes: 70, top1: 0, score: 120, businessNote: "11,50", originalScore: 75 },
        { id: "mag-4", title: "Évolution et refonte du parcours Facture U (Web & App)", category: "🔄️Convergence Off et On-Line", subCategory: "🖥️ Web, 📱 Apps", description: "Moderniser la consultation et le téléchargement des factures et tickets de caisse dématérialisés.", gains: "Bénéfice client : dématérialisation simple et rapide.\nBénéfice magasin : réduction des coûts d'impression.", votes: 70, top1: 0, score: 115, businessNote: "9,45", originalScore: 100 },
        { id: "mag-11", title: "Refonte de la pré-home Magasins U et convergence avec Courses U", category: "😣Urgences & Irritants", subCategory: "🖥️ Web", description: "Proposer un parcours d'entrée unifié permettant d'accéder plus rapidement au magasin de son choix et aux univers e-commerce.", gains: "Bénéfice client : accès instantané aux contenus utiles.\nBénéfice magasin : réduction du taux de rebond.", votes: 63, top1: 0, score: 105, businessNote: "5,40", originalScore: 100 },
        { id: "mag-12", title: "Espace Client : Refonte de la page fidélité (Niveau 2 ESC)", category: "🎨Personnalisation et fidélisation", subCategory: "👨‍💻 ESC", description: "Redynamiser le tableau de bord Fidélité avec l'affichage clair de la cagnotte Carte U et des avantages acquis.", gains: "Bénéfice client : vision synthétique de ses avantages.\nBénéfice magasin : engagement renforcé du programme Carte U.", votes: 60, top1: 0, score: 103, businessNote: "11,00", originalScore: 50 }
      ],
      "CoursesU": [
        { id: "cou-1", title: "Dettes Mécaniques promo manquantes et Automatisation des temps forts, jeudi +, prix coûtant, sur avantage", category: "Améliorer notre image prix", subCategory: "🏷️ Animation commerciale – Mécaniques commerciales spécifiques digitales", description: "Rendre jouables sur Courses U les 25 mécaniques promo du magasin qui ne le sont pas encore, et automatiser (suppression des actions manuelles) la mise en place des temps forts (jeudi Plus, prix coûtant, sur-avantage).", gains: "Bénéfice client : retrouver en ligne toutes les promos de son magasin.\nBénéfice magasin : parité promo avec le magasin et moins d'actions manuelles.", votes: 103, top1: 3, score: 192, businessNote: "25,9", originalScore: 150 },
        { id: "cou-19", title: "Recherche ultra-rapide V2 sur l'App", category: "Faciliter la vie du client", subCategory: "🔍 Search", description: "Recherche ultra-rapide V2, qui permet de chercher plusieurs produits d'un coup, et en améliorer le parcours. Implémentation sur l'App.", gains: "Bénéfice client : faire sa liste en quelques secondes.\nBénéfice magasin : des paniers constitués plus vite et plus complets.", votes: 83, top1: 0, score: 142, businessNote: "29,5", originalScore: 50 },
        { id: "cou-36", title: "Chaînage EAN (gestion des changements de codes produits)", category: "Fiabiliser notre catalogue", subCategory: "🗃️ Donnée produit", description: "Conserver le lien entre l'ancien et le nouveau code d'un produit qui change d'EAN (nouveau packaging, nouveau prix), et en informer le client.", gains: "Bénéfice client : retrouver ses produits dans ses achats récents et ses favoris.\nBénéfice magasin : ne plus perdre de produits dans les habitudes d'achat.", votes: 71, top1: 1, score: 120, businessNote: "14,7", originalScore: 150 },
        { id: "cou-10", title: "E-tracts - Usage 2 : Ajout direct au panier depuis e-tract", category: "Améliorer notre image prix", subCategory: "📣 Mise en avant des promos", description: "Permettre d'ajouter au panier Courses U les produits vus dans les e-tracts de Magasins U.", gains: "Bénéfice client : passer du tract à la commande en un clic.\nBénéfice magasin : transformer la consultation du tract en ventes.", votes: 61, top1: 1, score: 105, businessNote: "20,8", originalScore: 100 },
        { id: "cou-16", title: "Recommandations mini panier & checkout", category: "Améliorer notre image prix", subCategory: "🎯 Hyper-personnalisation", description: "Proposer des produits complémentaires dans le mini panier et au moment de valider la commande.", gains: "Bénéfice client : ne rien oublier.\nBénéfice magasin : hausse du panier moyen.", votes: 52, top1: 0, score: 98, businessNote: "51,6", originalScore: 50 },
        { id: "cou-29", title: "Listes de courses : Retravail de la page Mes listes", category: "Faciliter la vie du client", subCategory: "🍽️ Bien manger", description: "Retravailler la page « Mes listes de courses » : modules plus utiles et personnalisés selon le profil.", gains: "Bénéfice client : refaire ses courses habituelles plus vite.\nBénéfice magasin : des clients qui reviennent plus souvent.", votes: 50, top1: 0, score: 86, businessNote: "29,5", originalScore: 50 },
        { id: "cou-18", title: "Fusion Pré-home et Home", category: "Faciliter la vie du client", subCategory: "🚪 Accéder", description: "Refondre le parcours d'entrée (pré-home et page d'accueil) pour accéder plus vite aux rayons clés et aux opérations du moment.", gains: "Bénéfice client : une entrée plus simple et plus claire.\nBénéfice magasin : plus de visites qui se transforment en commandes.", votes: 40, top1: 0, score: 73, businessNote: "17,7", originalScore: 100 },
        { id: "cou-12", title: "Activation des offres", category: "Améliorer notre image prix", subCategory: "📣 Mise en avant des promos", description: "Guider le client dans l'activation des offres de type 10 %, par exemple avec un lien vers les produits éligibles depuis le bloc d'offre.", gains: "Bénéfice client : comprendre et utiliser ses offres.\nBénéfice magasin : plus d'offres activées et réellement utilisées.", votes: 40, top1: 0, score: 69, businessNote: "4,7", originalScore: 100 }
      ],
      "MeP": [
        { id: "mep-1", title: "Pilotage de la publication sur Courses U", category: "Modeles Exploitation (MeP)", subCategory: "📦 Publication & Assortiment", description: "Optimiser le pilotage de la mise en ligne des articles, la gestion des VMS et des stocks publiables.", gains: "Bénéfice client : visibilité sur la disponibilité réelle.\nBénéfice magasin : réduction du taux de manquants.", votes: 114, top1: 4, score: 210, businessNote: "10,0", originalScore: 100 },
        { id: "mep-6", title: "Chaînage des articles & fiabilisation UC liées", category: "Modeles Exploitation (MeP)", subCategory: "🔍 Manquants", description: "Améliorer le chaînage automatique entre unités de vente et emballages promo.", gains: "Bénéfice client : commande exacte du besoin.\nBénéfice magasin : préparation de commande simplifiée.", votes: 92, top1: 2, score: 167, businessNote: "4,0", originalScore: 100 },
        { id: "mep-22", title: "Process de remise au coffre digitalisé", category: "Modeles Exploitation (MeP)", subCategory: "🛒 Remise au coffre", description: "Accélérer la remise des commandes au Drive via terminal mobile et validation dématérialisée.", gains: "Bénéfice client : attente minimale au coffre.\nBénéfice magasin : rotation rapide des pistes Drive.", votes: 71, top1: 1, score: 122, businessNote: "2,0", originalScore: 100 }
      ]
    };

    let activePerimeter = "MagasinsU";
    let jsonData = {};

    document.addEventListener("DOMContentLoaded", () => {
      fetch(`data.json?v=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          jsonData = data;
          renderList();
        })
        .catch(err => {
          console.warn("Utilisation des données intégrées :", err);
          renderList();
        });
    });

    function switchPerimeter(perimeter) {
      activePerimeter = perimeter;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.className = "tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-white text-slate-600 border-slate-200 hover:bg-slate-100";
        const badge = btn.querySelector("span");
        if (badge) badge.className = "px-2 py-0.5 text-xs rounded-full bg-slate-100 text-slate-600";
      });

      const activeBtn = document.getElementById(`cta-${perimeter}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-indigo-600 text-white border-indigo-600 shadow-xs";
        const badge = activeBtn.querySelector("span");
        if (badge) badge.className = "px-2 py-0.5 text-xs rounded-full bg-white/20 text-white";
      }
      renderList();
    }

    function getBadgeStyle(text, offset = 0) {
      if (!text) return 'background-color: #f1f5f9; color: #334155; border: 1px solid #e2e8f0;';
      const colorPalette = [
        { bg: '#e0f2fe', text: '#0369a1', border: '#bae6fd' },
        { bg: '#fef3c7', text: '#b45309', border: '#fde68a' },
        { bg: '#dcfce7', text: '#15803d', border: '#bbf7d0' },
        { bg: '#f3e8ff', text: '#6b21a8', border: '#e9d5ff' },
        { bg: '#ffe4e6', text: '#be123c', border: '#fecdd3' },
        { bg: '#ccfbf1', text: '#0f766e', border: '#99f6e4' },
        { bg: '#ffedd5', text: '#c2410c', border: '#fed7aa' },
        { bg: '#f1f5f9', text: '#334155', border: '#e2e8f0' }
      ];
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
      const color = colorPalette[Math.abs(hash + offset) % colorPalette.length];
      return `background-color: ${color.bg}; color: ${color.text}; border: 1px solid ${color.border};`;
    }

    function renderList() {
      const container = document.getElementById("cards-list");
      const pollItems = pollResults[activePerimeter] || [];
      const jsonItems = jsonData[activePerimeter] || [];

      document.getElementById("count-MagasinsU").textContent = pollResults.MagasinsU.length;
      document.getElementById("count-CoursesU").textContent = pollResults.CoursesU.length;
      document.getElementById("count-MeP").textContent = pollResults.MeP.length;

      if (pollItems.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm bg-white rounded-2xl border border-slate-200">Aucun sujet disponible.</div>`;
        return;
      }

      container.innerHTML = pollItems.map((pollItem, idx) => {
        const fullItem = jsonItems.find(i => i.id === pollItem.id) || {};

        const title = fullItem.title || pollItem.title;
        const category = fullItem.category || pollItem.category || activePerimeter;
        const subCategory = fullItem.subCategory || pollItem.subCategory || fullItem.device || "";
        const description = fullItem.description || pollItem.description || "";
        const gains = fullItem.gains || pollItem.gains || "";
        const originalBusinessNote = fullItem.businessNote || pollItem.businessNote || null;
        const originalScore = fullItem.score || pollItem.originalScore || null;

        let rankBadgeClass = "bg-slate-200 text-slate-700 font-bold";
        if (idx === 0) rankBadgeClass = "bg-amber-500 text-white font-black";
        else if (idx === 1) rankBadgeClass = "bg-slate-400 text-white font-bold";
        else if (idx === 2) rankBadgeClass = "bg-amber-700 text-white font-bold";

        const catStyle = getBadgeStyle(category, 0);
        let badgesHtml = `<span style="${catStyle}" class="px-2.5 py-0.5 rounded-md font-semibold text-xs">${escapeHtml(category)}</span>`;

        if (subCategory && subCategory.trim() !== "") {
          const subStyle = getBadgeStyle(subCategory, 3);
          badgesHtml += `<span style="${subStyle}" class="px-2.5 py-0.5 rounded-md font-semibold text-xs">${escapeHtml(subCategory)}</span>`;
        }

        let detailsHtml = "";
        if (gains && gains.trim() !== "") {
          detailsHtml = `<div class="mt-2 pt-2 border-t border-slate-100 text-xs text-emerald-700 whitespace-pre-line"><strong>Gains / Bénéfices :</strong>\n${escapeHtml(gains)}</div>`;
        }

        return `
          <div class="p-5 bg-white border border-slate-200 rounded-2xl flex flex-col md:flex-row md:items-start justify-between gap-4 shadow-xs hover:shadow-md transition-all">
            <div class="flex items-start gap-3.5 min-w-0 flex-1">
              <span class="w-7 h-7 rounded-lg ${rankBadgeClass} text-xs flex items-center justify-center shrink-0 shadow-xs">#${idx + 1}</span>
              <div class="space-y-1.5 min-w-0 flex-1">
                <div class="flex gap-2 flex-wrap items-center">
                  ${badgesHtml}
                  <span class="text-[11px] font-mono text-slate-400">ID: ${pollItem.id}</span>
                </div>
                <h3 class="font-bold text-slate-900 text-base leading-snug">${escapeHtml(title)}</h3>
                ${description ? `<p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed mt-1">${escapeHtml(description)}</p>` : ''}
                ${detailsHtml}
              </div>
            </div>

            <div class="flex flex-wrap md:flex-col items-end justify-between md:justify-start gap-2 shrink-0 border-t md:border-t-0 pt-3 md:pt-0 border-slate-100">
              <span class="px-3 py-1 text-xs font-black bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-lg shadow-2xs">
                Score : ${pollItem.score} pts
              </span>
              <span class="px-2.5 py-1 text-[11px] font-semibold bg-emerald-50 text-emerald-700 rounded-md">
                ${pollItem.votes} votes ${pollItem.top1 > 0 ? `(${pollItem.top1}x #1)` : ''}
              </span>
              ${(originalBusinessNote || originalScore) ? `
                <span class="text-[11px] text-slate-400 font-medium">
                  Val. Bus : ${escapeHtml(originalBusinessNote \vert{}\vert{} '-')} \vert{} Poids :${originalScore ? originalScore + ' pts' : '-'}
                </span>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function escapeHtml(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
