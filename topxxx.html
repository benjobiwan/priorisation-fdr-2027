    let jsonData = {};

    document.addEventListener("DOMContentLoaded", () => {

        .then(data => {

          renderList();
        })
        .catch(err => {
          console.warn("Utilisation des données directes :", err);
          renderList();
        });

    function switchPerimeter(perimeter) {
      activePerimeter = perimeter;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.className = "tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-white text-slate-600 border-slate-200 hover:bg-slate-100";

        if (badge) badge.className = "px-2 py-0.5 text-xs rounded-full bg-slate-100 text-slate-600";
      });

      const activeBtn = document.getElementById(`cta-${perimeter}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn px-4 py-2 text-sm font-bold rounded-xl border transition-all flex items-center gap-2 whitespace-nowrap bg-indigo-600 text-white border-indigo-600 shadow-xs";
        const badge = activeBtn.querySelector("span");
        if (badge) badge.className = "px-2 py-0.5 text-xs rounded-full bg-white/20 text-white";
      }
      renderList();
    }

    function getBadgeStyle(text, offset = 0) {
      if (!text) return 'background-color: #f1f5f9; color: #334155; border: 1px solid #e2e8f0;';
      const colorPalette = [
        { bg: '#e0f2fe', text: '#0369a1', border: '#bae6fd' },
        { bg: '#fef3c7', text: '#b45309', border: '#fde68a' },
        { bg: '#dcfce7', text: '#15803d', border: '#bbf7d0' },
        { bg: '#f3e8ff', text: '#6b21a8', border: '#e9d5ff' },
        { bg: '#ffe4e6', text: '#be123c', border: '#fecdd3' },
        { bg: '#ccfbf1', text: '#0f766e', border: '#99f6e4' },
        { bg: '#ffedd5', text: '#c2410c', border: '#fed7aa' },
        { bg: '#f1f5f9', text: '#334155', border: '#e2e8f0' }
      ];
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
      const color = colorPalette[Math.abs(hash + offset) % colorPalette.length];
      return `background-color: ${color.bg}; color: ${color.text}; border: 1px solid ${color.border};`;
    }

    function renderList() {
      const container = document.getElementById("cards-list");
      const pollItems = pollResults[activePerimeter] || [];
      const jsonItems = jsonData[activePerimeter] || [];

      document.getElementById("count-MagasinsU").textContent = pollResults.MagasinsU.length;
      document.getElementById("count-CoursesU").textContent = pollResults.CoursesU.length;
      document.getElementById("count-MeP").textContent = pollResults.MeP.length;

      if (pollItems.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm bg-white rounded-2xl border border-slate-200">Aucun sujet disponible.</div>`;
        return;
      }

      container.innerHTML = pollItems.map((pollItem, idx) => {
        // Recherche stricte par ID exact
        const fullItem = jsonItems.find(i => i.id === pollItem.id) || {};

        const title = fullItem.title || pollItem.title;
        const category = fullItem.category || activePerimeter;
        const subCategory = fullItem.subCategory || fullItem.device || "";
        const description = fullItem.description || "";
        const gains = fullItem.gains || "";
        const originalBusinessNote = fullItem.businessNote || null;
        const originalScore = fullItem.score || null;

        let rankBadgeClass = "bg-slate-200 text-slate-700 font-bold";
        if (idx === 0) rankBadgeClass = "bg-amber-500 text-white font-black";
        else if (idx === 1) rankBadgeClass = "bg-slate-400 text-white font-bold";
        else if (idx === 2) rankBadgeClass = "bg-amber-700 text-white font-bold";

        const catStyle = getBadgeStyle(category, 0);
        let badgesHtml = `<span style="${catStyle}" class="px-2.5 py-0.5 rounded-md font-semibold text-xs">${escapeHtml(category)}</span>`;

        if (subCategory && subCategory.trim() !== "") {
          const subStyle = getBadgeStyle(subCategory, 3);
          badgesHtml += `<span style="${subStyle}" class="px-2.5 py-0.5 rounded-md font-semibold text-xs">${escapeHtml(subCategory)}</span>`;
        }

        let detailsHtml = "";
        if (gains && gains.trim() !== "") {
          detailsHtml = `<div class="mt-2 pt-2 border-t border-slate-100 text-xs text-emerald-700 whitespace-pre-line"><strong>Gains / Bénéfices :</strong>\n${escapeHtml(gains)}</div>`;
        }

        return `
          <div class="p-5 bg-white border border-slate-200 rounded-2xl flex flex-col md:flex-row md:items-start justify-between gap-4 shadow-xs hover:shadow-md transition-all">
            <div class="flex items-start gap-3.5 min-w-0 flex-1">
              <span class="w-7 h-7 rounded-lg ${rankBadgeClass} text-xs flex items-center justify-center shrink-0 shadow-xs">#${idx + 1}</span>
              <div class="space-y-1.5 min-w-0 flex-1">
                <div class="flex gap-2 flex-wrap items-center">
                  ${badgesHtml}
                  <span class="text-[11px] font-mono text-slate-400">ID: ${pollItem.id}</span>
                </div>
                <h3 class="font-bold text-slate-900 text-base leading-snug">${escapeHtml(title)}</h3>
                ${description ? `<p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed mt-1">${escapeHtml(description)}</p>` : ''}
                ${detailsHtml}
              </div>
            </div>

            <div class="flex flex-wrap md:flex-col items-end justify-between md:justify-start gap-2 shrink-0 border-t md:border-t-0 pt-3 md:pt-0 border-slate-100">
              <span class="px-3 py-1 text-xs font-black bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-lg shadow-2xs">
                Score : ${pollItem.score} pts
              </span>
              <span class="px-2.5 py-1 text-[11px] font-semibold bg-emerald-50 text-emerald-700 rounded-md">
                ${pollItem.votes} votes ${pollItem.top1 > 0 ? `(${pollItem.top1}x #1)` : ''}
              </span>
              ${(originalBusinessNote || originalScore) ? `
  <span class="text-[11px] text-slate-400 font-medium">
    Val. Bus : ${escapeHtml(originalBusinessNote || '-')} | Poids : ${originalScore ? originalScore + ' pts' : '-'}
  </span>
` : ''}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function escapeHtml(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
