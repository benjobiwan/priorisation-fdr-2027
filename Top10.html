<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 10 Restitution FdR 2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <!-- EN-TÊTE PRINCIPAL -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 mb-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour à l'accueil
          </a>
          <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            🏆 Top 10 Cartes Restituées par Périmètre — FdR 2027
          </h1>
        </div>
        <div class="text-xs text-slate-500 font-medium">
          Croisement données Sondage × Fiches complètes JSON
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="results-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8"></div>
  </main>

  <script>
    // 1. RÉSULTATS DES VOTES (Sondage)
    const pollResults = {
      "MagasinsU": [
        { id: "mag-13", votes: 30, top1: 0, priorityScore: 55 },
        { id: "mag-10", votes: 30, top1: 0, priorityScore: 49 },
        { id: "mag-8", votes: 30, top1: 0, priorityScore: 48 },
        { id: "mag-15", votes: 21, top1: 1, priorityScore: 41 },
        { id: "mag-3", votes: 21, top1: 1, priorityScore: 40 },
        { id: "mag-2", votes: 20, top1: 0, priorityScore: 39 },
        { id: "mag-16", votes: 21, top1: 1, priorityScore: 38 },
        { id: "mag-12", votes: 20, top1: 0, priorityScore: 33 },
        { id: "mag-7", votes: 20, top1: 0, priorityScore: 30 },
        { id: "mag-1", votes: 11, top1: 1, priorityScore: 21 }
      ],
      "CoursesU": [
        { id: "cou-12", votes: 21, top1: 0, priorityScore: 35 },
        { id: "cou-17", votes: 20, top1: 0, priorityScore: 29 },
        { id: "cou-19", votes: 20, top1: 0, priorityScore: 26 },
        { id: "cou-21", votes: 20, top1: 0, priorityScore: 23 },
        { id: "cou-2", votes: 11, top1: 1, priorityScore: 21 },
        { id: "cou-47", votes: 11, top1: 1, priorityScore: 21 },
        { id: "cou-13", votes: 10, top1: 1, priorityScore: 20 },
        { id: "cou-3", votes: 10, top1: 1, priorityScore: 20 },
        { id: "cou-48", votes: 10, top1: 1, priorityScore: 20 },
        { id: "cou-14", votes: 10, top1: 1, priorityScore: 19 }
      ],
      "MeP": [
        { id: "mep-3", votes: 11, top1: 1, priorityScore: 21 },
        { id: "mep-5", votes: 10, top1: 0, priorityScore: 20 },
        { id: "mep-8", votes: 10, top1: 0, priorityScore: 19 },
        { id: "mep-7", votes: 10, top1: 0, priorityScore: 18 },
        { id: "mep-11", votes: 10, top1: 0, priorityScore: 17 },
        { id: "mep-13", votes: 10, top1: 0, priorityScore: 16 },
        { id: "mep-17", votes: 10, top1: 0, priorityScore: 15 },
        { id: "mep-19", votes: 10, top1: 0, priorityScore: 14 },
        { id: "mep-12", votes: 10, top1: 0, priorityScore: 13 },
        { id: "mep-21", votes: 10, top1: 0, priorityScore: 12 }
      ]
    };

    const sectionTitles = {
      "MagasinsU": { name: "Magasins U", icon: "store", color: "border-blue-200 bg-blue-50/50" },
      "CoursesU": { name: "Courses U", icon: "shopping-bag", color: "border-indigo-200 bg-indigo-50/50" },
      "MeP": { name: "Modèle Exploitation Productivité", icon: "settings", color: "border-emerald-200 bg-emerald-50/50" }
    };

    // GENERATEUR DE COULEUR DETERMINISTE (TICKETS / BADGES)
    function getCategoryColorStyle(text) {
      if (!text) return 'background-color: #f1f5f9; color: #334155; border: 1px solid #e2e8f0;';
      const colorPalette = [
        { bg: '#e0f2fe', text: '#0369a1', border: '#bae6fd' },
        { bg: '#fef3c7', text: '#b45309', border: '#fde68a' },
        { bg: '#dcfce7', text: '#15803d', border: '#bbf7d0' },
        { bg: '#f3e8ff', text: '#6b21a8', border: '#e9d5ff' },
        { bg: '#ffe4e6', text: '#be123c', border: '#fecdd3' },
        { bg: '#ccfbf1', text: '#0f766e', border: '#99f6e4' },
        { bg: '#ffedd5', text: '#c2410c', border: '#fed7aa' }
      ];
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
      const color = colorPalette[Math.abs(hash) % colorPalette.length];
      return `background-color: ${color.bg}; color: ${color.text}; border: 1px solid ${color.border};`;
    }

    function escapeHtml(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    // CHARGEMENT DATA.JSON
    async function loadDataAndRender() {
      try {
        const response = await fetch(`data.json?v=${Date.now()}`);
        if (!response.ok) throw new Error("Erreur de chargement de data.json");
        const fullData = await response.json();

        const container = document.getElementById("results-container");

        container.innerHTML = Object.keys(pollResults).map(perimeterKey => {
          const sectionConfig = sectionTitles[perimeterKey];
          const pollList = pollResults[perimeterKey];
          const jsonList = fullData[perimeterKey] || [];

          const cardsHtml = pollList.map((pollItem, idx) => {
            // MATCHING PAR ID
            const fullItem = jsonList.find(i => i.id === pollItem.id) || {};

            let rankClass = "bg-slate-200 text-slate-700";
            if (idx === 0) rankClass = "bg-amber-500 text-white font-black";
            else if (idx === 1) rankClass = "bg-slate-400 text-white font-bold";
            else if (idx === 2) rankClass = "bg-amber-700 text-white font-bold";

            // CONSTITUTION DES BADGES
            const categoryStyle = getCategoryColorStyle(fullItem.category || sectionConfig.name);
            let badgesHtml = `<span style="${categoryStyle}" class="px-2.5 py-0.5 rounded-md font-semibold text-xs">${escapeHtml(fullItem.category || sectionConfig.name)}</span>`;

            if (perimeterKey === "MagasinsU" && fullItem.device) {
              badgesHtml += `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs font-medium">${escapeHtml(fullItem.device)}</span>`;
            }

            // DETAILS SUPPLEMENTAIRES (GAINS & RESULTATS)
            let detailsHtml = "";
            if (fullItem.gains && fullItem.gains.trim() !== "" && fullItem.gains !== "Non spécifié") {
              detailsHtml += `
                <div class="mt-2 pt-2 border-t border-slate-100 text-xs">
                  <p class="text-emerald-700"><strong>Gain(s) attendu(s) :</strong> ${escapeHtml(fullItem.gains)}</p>
                </div>`;
            }

            if (perimeterKey === "CoursesU" && fullItem.resultats && fullItem.resultats.trim() !== "") {
              detailsHtml += `
                <div class="mt-1 text-xs">
                  <p class="text-slate-500"><strong>Résultats clés :</strong> ${escapeHtml(fullItem.resultats)}</p>
                </div>`;
            }

            const titleText = fullItem.title || pollItem.title || "Titre non disponible";
            const descText = fullItem.description || "Description indisponible.";
            const valBus = fullItem.businessNote ? `${fullItem.businessNote}` : '-';
            const weightPts = fullItem.score ? `${fullItem.score} pts` : '-';

            return `
              <div class="p-4 bg-white border border-slate-200 rounded-xl flex items-start justify-between gap-3 shadow-xs hover:shadow-md transition-all">
                <div class="flex items-start gap-3 min-w-0 flex-1">
                  <span class="w-6 h-6 rounded-md ${rankClass} text-xs flex items-center justify-center shrink-0">#${idx + 1}</span>
                  <div class="space-y-1 min-w-0 flex-1">
                    <div class="flex gap-1.5 flex-wrap text-xs mb-1">
                      ${badgesHtml}
                    </div>
                    <h3 class="font-bold text-slate-900 text-sm leading-snug">${escapeHtml(titleText)}</h3>
                    <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed">${escapeHtml(descText)}</p>
                    ${detailsHtml}
                  </div>
                </div>

                <!-- METRIQUES DROITE (VALEUR BUS + VOTES + SCORE PRIORITE) -->
                <div class="flex flex-col items-end gap-1.5 shrink-0">
                  <div class="flex items-center gap-1.5">
                    <span class="px-2 py-0.5 text-[11px] font-semibold bg-emerald-50 text-emerald-700 rounded-lg">Val. Bus: ${escapeHtml(valBus)}</span>
                    <span class="px-2 py-0.5 text-[11px] font-black bg-indigo-50 text-indigo-700 rounded-lg">${weightPts}</span>
                  </div>
                  <div class="mt-1 text-right">
                    <span class="px-2.5 py-1 text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200 rounded-lg inline-block">
                      Prio: ${pollItem.priorityScore} pts
                    </span>
                    <p class="text-[10px] text-slate-400 mt-0.5 font-medium">
                      ${pollItem.votes} votes ${pollItem.top1 > 0 ? `(${pollItem.top1}x #1)` : ''}
                    </p>
                  </div>
                </div>
              </div>
            `;
          }).join('');

          return `
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col">
              <div class="p-4 border-b border-slate-100 flex items-center justify-between ${sectionConfig.color} rounded-t-2xl">
                <div class="flex items-center gap-2">
                  <i data-lucide="${sectionConfig.icon}" class="w-5 h-5 text-slate-700"></i>
                  <h2 class="font-bold text-slate-900 text-base">${sectionConfig.name}</h2>
                </div>
                <span class="px-2.5 py-0.5 text-xs font-bold bg-white text-slate-700 rounded-full border border-slate-200 shadow-2xs">Top 10</span>
              </div>
              <div class="p-4 space-y-3 flex-1 overflow-y-auto">
                ${cardsHtml}
              </div>
            </section>
          `;
        }).join('');

        lucide.createIcons();

      } catch (err) {
        console.error(err);
        document.getElementById("results-container").innerHTML = `<div class="col-span-3 p-8 text-center text-red-500 font-semibold bg-white rounded-xl border border-red-200">Erreur lors de la réconciliation des données : ${err.message}</div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", loadDataAndRender);
  </script>
</body>
</html>
