<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priorisation des Feuilles de Route 2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col justify-center items-center p-6">

  <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-8">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-2xl mb-2">
        <i data-lucide="layers" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Feuilles de Route 2027</h1>
      <p class="text-sm text-slate-500">Sélectionnez la feuille de route à prioriser.</p>
    </div>

    <div class="space-y-4">
      
      <!-- LIEN MAGASINSU -->
      <a href="tool.html?sheet=MagasinsU&title=Magasins%20U" class="group p-5 bg-slate-50 hover:bg-indigo-50/60 border border-slate-200 hover:border-indigo-300 rounded-2xl transition-all flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="p-3 bg-white text-indigo-600 rounded-xl shadow-xs group-hover:bg-indigo-600 group-hover:text-white transition-colors">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-900 group-hover:text-indigo-900">Magasins U</h2>
            <p class="text-xs text-slate-500">Feuille de route 2027 Magasins U</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all"></i>
      </a>

      <!-- LIEN COURSESU -->
      <a href="tool.html?sheet=CoursesU&title=Courses%20U" class="group p-5 bg-slate-50 hover:bg-indigo-50/60 border border-slate-200 hover:border-indigo-300 rounded-2xl transition-all flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="p-3 bg-white text-indigo-600 rounded-xl shadow-xs group-hover:bg-indigo-600 group-hover:text-white transition-colors">
            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-900 group-hover:text-indigo-900">Courses U</h2>
            <p class="text-xs text-slate-500">Feuille de route 2027 Courses U</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all"></i>
      </a>

      <!-- LIEN MEP -->
      <a href="tool.html?sheet=MeP&title=Mod%C3%A8le%20Exploitation%20Productivit%C3%A9" class="group p-5 bg-slate-50 hover:bg-indigo-50/60 border border-slate-200 hover:border-indigo-300 rounded-2xl transition-all flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="p-3 bg-white text-indigo-600 rounded-xl shadow-xs group-hover:bg-indigo-600 group-hover:text-white transition-colors">
            <i data-lucide="cpu" class="w-6 h-6"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-900 group-hover:text-indigo-900">Modèle Exploitation Productivité</h2>
            <p class="text-xs text-slate-500">Feuille de route 2027 MeP</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all"></i>
      </a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
