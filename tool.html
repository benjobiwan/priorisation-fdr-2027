<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outil de Priorisation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <!-- EN-TÊTE PRINCIPAL -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 mb-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour à l'accueil
          </a>
          <h1 id="page-title" class="text-xl font-bold text-slate-900 flex items-center gap-2">
            Priorisation FdR 2027
          </h1>
        </div>

        <div class="flex items-center gap-4 bg-slate-100 p-3 rounded-xl border border-slate-200">
          <div class="flex items-center gap-2">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">Plafond max :</label>
            <div class="relative">
              <input type="number" id="max-score-input" value="1000" disabled class="w-24 pl-3 pr-8 py-1 text-sm font-bold bg-slate-200/70 border border-slate-300 rounded-lg text-slate-600 cursor-not-allowed outline-none">
              <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400">pts</span>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <div class="flex justify-between items-center text-xs font-semibold mb-1.5">
          <span class="text-slate-600">Consommation du budget</span>
          <span id="score-counter" class="font-bold text-slate-900">0 / 1000 pts</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200">
          <div id="progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300 w-0"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ALERTE DE DÉPASSEMENT -->
  <div id="alert-banner" class="hidden bg-amber-50 border-b border-amber-200 px-4 py-3">
    <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-amber-800 text-sm font-medium">
        <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 shrink-0"></i>
        <span id="alert-message">Alerte</span>
      </div>
      <button onclick="dismissAlert()" class="text-amber-600 hover:text-amber-800 p-1 rounded-md"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL PLEINE LARGEUR -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-2 gap-8 min-h-0">
    <!-- COLONNE GAUCHE : DISPONIBLES -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col min-h-[500px]">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 rounded-t-2xl">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-slate-400"></span>
          <h2 class="font-bold text-slate-800">Sujets disponibles</h2>
          <span id="count-available" class="px-2 py-0.5 text-xs font-semibold bg-slate-200 text-slate-700 rounded-full">0</span>
        </div>
      </div>
      <div id="list-available" class="flex-1 p-4 overflow-y-auto space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'available')"></div>
    </section>

    <!-- COLONNE DROITE : SÉLECTIONNÉS -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col min-h-[500px]">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-indigo-50/30 rounded-t-2xl">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-indigo-600"></span>
          <h2 class="font-bold text-slate-800">Sujets Retenus (Par ordre de priorité)</h2>
          <span id="count-selected" class="px-2 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-700 rounded-full">0</span>
        </div>
      </div>
      <div id="list-selected" class="flex-1 p-4 overflow-y-auto space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'selected')"></div>

      <!-- BOUTON ENREGISTREMENT -->
      <div class="p-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
        <button id="submit-btn" onclick="saveToGoogleSheet()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
          Enregistrer mon classement dans Google Sheet
        </button>
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex flex-col items-center justify-center text-white">
    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-3 text-slate-800">
      <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="font-semibold text-sm">Chargement de la liste...</p>
    </div>
  </div>

  <script>
    // COLLEZ VOTRE URL DE DÉPLOIEMENT APPS SCRIPT ICI :
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzFS1xsDb5WHF-mYxytrlXS2h5D-xddzCQlCqhMCdhppp3gXp2fRP2YPOMtnNvaCNWesQ/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const sheetTarget = urlParams.get('sheet') || "MagasinsU - BdD Intentions 2027";
    const customTitle = urlParams.get('title') || "Feuille de Route";

    let availableItems = [];
    let selectedItems = [];
    const maxScoreLimit = 1000;
    let draggedItemId = null;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("page-title").textContent = `Priorisation FdR 2027 - ${customTitle}`;
      loadSheetData();
    });

    async function loadSheetData() {
      showLoading(true);
      try {
        const response = await fetch(`${GOOGLE_SHEET_API_URL}?sheet=${encodeURIComponent(sheetTarget)}`);
        availableItems = await response.json();
        render();
      } catch (err) {
        showAlert("Erreur de chargement de la liste depuis Google Sheet.");
      } finally {
        showLoading(false);
      }
    }

    async function saveToGoogleSheet() {
      if (selectedItems.length === 0) return showAlert("Sélectionnez au moins un sujet.");

      const userName = prompt("Entrez votre Prénom et Nom pour valider la soumission :", "");
      if (!userName) return;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = "Enregistrement en cours...";

      try {
        const response = await fetch(GOOGLE_SHEET_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            listName: customTitle,
            userName: userName,
            selectedItems: selectedItems
          })
        });

        const res = await response.json();
        if (res.status === "SUCCESS") {
          alert(`✅ Votre classement a été enregistré avec succès sous l'onglet '${res.sheetName}' !`);
        } else {
          throw new Error(res.message);
        }
      } catch (e) {
        alert("⚠️ Une erreur est survenue lors de l'enregistrement : " + e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Enregistrer mon classement dans Google Sheet`;
        lucide.createIcons();
      }
    }

    function getTotalSelectedScore() { return selectedItems.reduce((sum, item) => sum + item.score, 0); }

    function selectItem(id) {
      const idx = availableItems.findIndex(i => i.id === id);
      if (idx === -1) return;
      const item = availableItems[idx];
      if (getTotalSelectedScore() + item.score > maxScoreLimit) {
        return showAlert(`Impossible d'ajouter "${item.title}". Poids (${item.score} pts) trop élevé.`);
      }
      availableItems.splice(idx, 1);
      selectedItems.push(item);
      dismissAlert(); render();
    }

    function deselectItem(id) {
      const idx = selectedItems.findIndex(i => i.id === id);
      if (idx === -1) return;
      availableItems.push(selectedItems.splice(idx, 1)[0]);
      dismissAlert(); render();
    }

    function movePriority(id, dir) {
      const idx = selectedItems.findIndex(i => i.id === id);
      if (idx === -1 || idx + dir < 0 || idx + dir >= selectedItems.length) return;
      const temp = selectedItems[idx];
      selectedItems[idx] = selectedItems[idx + dir];
      selectedItems[idx + dir] = temp;
      render();
    }

    function handleDragStart(e, id) { draggedItemId = id; e.dataTransfer.setData("text/plain", id); }
    function allowDrop(e) { e.preventDefault(); }
    function handleDrop(e, target) {
      e.preventDefault();
      if (!draggedItemId) return;
      const isSelected = selectedItems.some(i => i.id === draggedItemId);
      if (target === "selected" && !isSelected) selectItem(draggedItemId);
      if (target === "available" && isSelected) deselectItem(draggedItemId);
    }

    function render() {
      renderList("list-available", availableItems, false);
      renderList("list-selected", selectedItems, true);
      updateGauge();
      lucide.createIcons();
    }

    function renderList(elemId, items, isSelected) {
      const container = document.getElementById(elemId);
      document.getElementById(elemId === "list-available" ? "count-available" : "count-selected").textContent = items.length;
      if (items.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">Aucun sujet ici.</div>`;
        return;
      }
      container.innerHTML = items.map((item, idx) => `
        <div draggable="true" ondragstart="handleDragStart(event, '${item.id}')" onclick="${!isSelected ? `selectItem('${item.id}')` : ''}" class="p-4 bg-white border border-slate-200 rounded-xl flex items-start justify-between gap-3 shadow-xs hover:shadow-md cursor-pointer">
          <div class="flex items-start gap-3 min-w-0 flex-1">
            ${isSelected ? `<span class="w-6 h-6 rounded-md bg-indigo-600 text-white font-bold text-xs flex items-center justify-center shrink-0">#${idx+1}</span>` : ''}
            <div class="space-y-1 min-w-0 flex-1">
              <div class="flex gap-2 flex-wrap text-xs">
                <span class="px-2 py-0.5 bg-slate-100 rounded font-semibold text-slate-600">${escapeHtml(item.category)}</span>
                <span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded">${escapeHtml(item.device)}</span>
                <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded">Val. Bus. : ${escapeHtml(item.businessNote)}</span>
              </div>
              <h3 class="font-bold text-slate-900">${escapeHtml(item.title)}</h3>
              <p class="text-xs text-slate-600 whitespace-pre-line">${escapeHtml(item.description)}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${isSelected ? `
              <div class="flex flex-col gap-0.5">
                <button onclick="event.stopPropagation(); movePriority('${item.id}', -1)" class="p-1 hover:bg-slate-100 rounded"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>
                <button onclick="event.stopPropagation(); movePriority('${item.id}', 1)" class="p-1 hover:bg-slate-100 rounded"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>
              </div>
            ` : ''}
            <span class="px-2.5 py-1 text-xs font-black bg-indigo-50 text-indigo-700 rounded-lg">${item.score} pts</span>
            ${isSelected ? `<button onclick="deselectItem('${item.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="minus-circle" class="w-5 h-5"></i></button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function updateGauge() {
      const score = getTotalSelectedScore();
      document.getElementById("score-counter").textContent = `${score} / ${maxScoreLimit} pts`;
      document.getElementById("progress-bar").style.width = `${Math.min(100, (score / maxScoreLimit) * 100)}%`;
    }

    function showAlert(msg) { document.getElementById("alert-message").textContent = msg; document.getElementById("alert-banner").classList.remove("hidden"); }
    function dismissAlert() { document.getElementById("alert-banner").classList.add("hidden"); }
    function showLoading(show) { document.getElementById("loading-overlay").className = show ? "fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex flex-col items-center justify-center text-white" : "hidden"; }
    function escapeHtml(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
