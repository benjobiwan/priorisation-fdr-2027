<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outil de Priorisation - Feuille de Route 2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <!-- IFRAME INVISIBLE POUR SOUMISSION SILENCIEUSE -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <!-- EN-TÊTE PRINCIPAL -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 mb-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour à l'accueil
          </a>
          <h1 id="page-title" class="text-xl font-bold text-slate-900 flex items-center gap-2">
            Priorisation FdR 2027
          </h1>
        </div>

        <div class="flex items-center gap-4 bg-slate-100 p-3 rounded-xl border border-slate-200">
          <div class="flex items-center gap-2">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">Plafond max :</label>
            <div class="relative">
              <input type="number" id="max-score-input" value="1000" disabled class="w-24 pl-3 pr-8 py-1 text-sm font-bold bg-slate-200/70 border border-slate-300 rounded-lg text-slate-600 cursor-not-allowed outline-none">
              <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400">pts</span>
            </div>
          </div>
        </div>
      </div>

      <!-- JAUGE DE CONSOMMATION -->
      <div class="mt-4">
        <div class="flex justify-between items-center text-xs font-semibold mb-1.5">
          <span class="text-slate-600">Budget consommé</span>
          <span id="score-counter" class="font-bold text-slate-900">0 / 1000 pts</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200">
          <div id="progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300 w-0"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- BANNIÈRE D'ALERTE -->
  <div id="alert-banner" class="hidden bg-amber-50 border-b border-amber-200 px-4 py-3">
    <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-amber-800 text-sm font-medium">
        <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 shrink-0"></i>
        <span id="alert-message">Alerte</span>
      </div>
      <button onclick="dismissAlert()" class="text-amber-600 hover:text-amber-800 p-1 rounded-md">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-2 gap-8 min-h-0">
    <!-- COLONNE GAUCHE : SUJETS DISPONIBLES -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col min-h-[500px]">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 rounded-t-2xl gap-2 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-slate-400"></span>
          <h2 class="font-bold text-slate-800">Sujets disponibles</h2>
          <span id="count-available" class="px-2 py-0.5 text-xs font-semibold bg-slate-200 text-slate-700 rounded-full">0</span>
        </div>

        <!-- MENU DE TRI DYNAMIQUE -->
        <div class="flex items-center gap-1.5">
          <label for="sort-select" class="text-xs text-slate-500 font-medium whitespace-nowrap">Trier par :</label>
          <select id="sort-select" onchange="handleSortChange(this.value)" class="text-xs bg-white border border-slate-200 rounded-lg px-2 py-1 font-semibold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer">
            <option value="default">Par défaut</option>
            <option value="business-desc">Valeur Business (↓ Décroissant)</option>
            <option value="business-asc">Valeur Business (↑ Croissant)</option>
            <option value="score-desc">Poids (↓ Décroissant)</option>
            <option value="score-asc">Poids (↑ Croissant)</option>
          </select>
        </div>
      </div>
      <div id="list-available" class="flex-1 p-4 overflow-y-auto space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'available')"></div>
    </section>

    <!-- COLONNE DROITE : SUJETS RETENUS -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col min-h-[500px]">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-indigo-50/30 rounded-t-2xl">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-indigo-600"></span>
          <h2 class="font-bold text-slate-800">Sujets Retenus (Par ordre de priorité)</h2>
          <span id="count-selected" class="px-2 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-700 rounded-full">0</span>
        </div>
      </div>
      <div id="list-selected" class="flex-1 p-4 overflow-y-auto space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'selected')"></div>

      <div class="p-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
        <button id="submit-btn" onclick="saveToGoogleSheet()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
          Enregistrer mon classement
        </button>
      </div>
    </section>
  </main>

  <!-- OVERLAY DE CHARGEMENT -->
  <div id="loading-overlay" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex flex-col items-center justify-center text-white">
    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-3 text-slate-800">
      <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="font-semibold text-sm">Enregistrement du classement en cours...</p>
    </div>
  </div>

  <script>
    // ⚙️ CONFIGURATION DU GOOGLE FORM (ENVOI SILENCIEUX)
    const FORM_RESPONSE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSerCU9huUOnaB9ERal9CKdgr6icw4ETHdYEWzSaD-ZF3_xtPQ/formResponse";
    const ENTRY_NAME = "entry.1556899417";
    const ENTRY_SUMMARY = "entry.1336496038";

    // ⚙️ PLAFONDS MAX PERSONNALISÉS PAR ONGLET
    const LIST_LIMITS = {
      "MagasinsU": 750,
      "CoursesU": 1000,
      "MeP": 500
    };

    const urlParams = new URLSearchParams(window.location.search);
    const sheetTarget = urlParams.get('sheet') || "MagasinsU";
    const customTitle = urlParams.get('title') || "Feuille de Route";

    const maxScoreLimit = LIST_LIMITS[sheetTarget] || 1000;

    let availableItems = [];
    let selectedItems = [];
    let draggedItemId = null;
    let currentSort = "default";

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("page-title").textContent = `Priorisation FdR 2027 - ${customTitle}`;
      document.getElementById("max-score-input").value = maxScoreLimit;
      loadSheetData();
    });

    // CHARGEMENT DEPUIS DATA.JSON
    function loadSheetData() {
      showLoading(true);

      fetch("data.json")
        .then(response => {
          if (!response.ok) throw new Error("Impossible de lire data.json");
          return response.json();
        })
        .then(data => {
          showLoading(false);
          const items = data[sheetTarget] || [];
          
          if (items.length === 0) {
            showAlert(`Aucune donnée trouvée pour '${sheetTarget}'`);
            return;
          }

          availableItems = items;
          sortAvailableItems();
          render();
        })
        .catch(err => {
          showLoading(false);
          showAlert("Erreur lors du chargement des données : " + err.message);
        });
    }

    // 🔀 GESTION ET LOGIQUE DU TRI DES SUJETS DISPONIBLES
    function handleSortChange(sortValue) {
      currentSort = sortValue;
      sortAvailableItems();
      render();
    }

    function sortAvailableItems() {
      if (currentSort === "default") return;

      availableItems.sort((a, b) => {
        const valBusA = parseFloat(String(a.businessNote || "0").replace(",", ".")) || 0;
        const valBusB = parseFloat(String(b.businessNote || "0").replace(",", ".")) || 0;
        
        const scoreA = Number(a.score) || 0;
        const scoreB = Number(b.score) || 0;

        switch (currentSort) {
          case "business-desc":
            return valBusB - valBusA;
          case "business-asc":
            return valBusA - valBusB;
          case "score-desc":
            return scoreB - scoreA;
          case "score-asc":
            return scoreA - scoreB;
          default:
            return 0;
        }
      });
    }

    // SOUMISSION AUTOMATIQUE ET SILENCIEUSE
    function saveToGoogleSheet() {
      if (selectedItems.length === 0) {
        return showAlert("Sélectionnez au moins un sujet avant de valider.");
      }

      const userName = prompt("Entrez votre Prénom et Nom pour valider la soumission :", "");
      if (!userName || userName.trim() === "") return;

      showLoading(true);

      const dateStr = new Date().toLocaleString("fr-FR", { timeZone: "Europe/Paris" });
      
      let textSummary = `Utilisateur : ${userName.trim()}\n`;
      textSummary += `Périmètre : ${customTitle} (${sheetTarget})\n`;
      textSummary += `Date : ${dateStr}\n`;
      textSummary += `Budget consommé : ${getTotalSelectedScore()} / ${maxScoreLimit} pts\n\n`;
      textSummary += `--- CLASSEMENT DES INTENTIONS ---\n`;
      
      selectedItems.forEach((item, index) => {
        textSummary += `#${index + 1} | [ID: ${item.id}] | [${item.category}] ${item.title} (${item.score} pts - Val. Bus: ${item.businessNote})\n`;
      });

      const form = document.createElement("form");
      form.method = "POST";
      form.action = FORM_RESPONSE_URL;
      form.target = "hidden_iframe";

      const nameInput = document.createElement("input");
      nameInput.type = "hidden";
      nameInput.name = ENTRY_NAME;
      nameInput.value = userName.trim();
      form.appendChild(nameInput);

      const summaryInput = document.createElement("input");
      summaryInput.type = "hidden";
      summaryInput.name = ENTRY_SUMMARY;
      summaryInput.value = textSummary;
      form.appendChild(summaryInput);

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);

      setTimeout(() => {
        showLoading(false);
        alert("✅ Votre classement a été enregistré avec succès !");
      }, 1000);
    }

    function getTotalSelectedScore() { return selectedItems.reduce((sum, item) => sum + item.score, 0); }

    function selectItem(id) {
      const idx = availableItems.findIndex(i => i.id === id);
      if (idx === -1) return;
      const item = availableItems[idx];
      if (getTotalSelectedScore() + item.score > maxScoreLimit) {
        return showAlert(`Impossible d'ajouter "${item.title}". Le poids (${item.score} pts) dépasse le budget.`);
      }
      availableItems.splice(idx, 1);
      selectedItems.push(item);
      dismissAlert(); render();
    }

    function deselectItem(id) {
      const idx = selectedItems.findIndex(i => i.id === id);
      if (idx === -1) return;
      availableItems.push(selectedItems.splice(idx, 1)[0]);
      sortAvailableItems();
      dismissAlert(); render();
    }

    function movePriority(id, dir) {
      const idx = selectedItems.findIndex(i => i.id === id);
      if (idx === -1 || idx + dir < 0 || idx + dir >= selectedItems.length) return;
      const temp = selectedItems[idx];
      selectedItems[idx] = selectedItems[idx + dir];
      selectedItems[idx + dir] = temp;
      render();
    }

    function handleDragStart(e, id) { draggedItemId = id; e.dataTransfer.setData("text/plain", id); }
    function allowDrop(e) { e.preventDefault(); }
    function handleDrop(e, target) {
      e.preventDefault();
      if (!draggedItemId) return;
      const isSelected = selectedItems.some(i => i.id === draggedItemId);
      if (target === "selected" && !isSelected) selectItem(draggedItemId);
      if (target === "available" && isSelected) deselectItem(draggedItemId);
    }

    function render() {
      renderList("list-available", availableItems, false);
      renderList("list-selected", selectedItems, true);
      updateGauge();
      lucide.createIcons();
    }

    // RENDU DYNAMIQUE ADAPTÉ À CHAQUE ONGLET
    function renderList(elemId, items, isSelected) {
      const container = document.getElementById(elemId);
      document.getElementById(elemId === "list-available" ? "count-available" : "count-selected").textContent = items.length;
      
      if (items.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">Aucun sujet ici.</div>`;
        return;
      }

      container.innerHTML = items.map((item, idx) => {
        let badgesHtml = `<span class="px-2 py-0.5 bg-slate-100 rounded font-semibold text-slate-600">${escapeHtml(item.category)}</span>`;
        let detailsHtml = "";

        if (sheetTarget === "MagasinsU") {
          if (item.device) badgesHtml += `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded">${escapeHtml(item.device)}</span>`;
          if (item.chantier) badgesHtml += `<span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded">${escapeHtml(item.chantier)}</span>`;
        } 
        else if (sheetTarget === "CoursesU") {
          if (item.chantier) badgesHtml += `<span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded">${escapeHtml(item.chantier)}</span>`;
          
          if (item.gains || item.resultats) {
            detailsHtml += `<div class="mt-2 pt-2 border-t border-slate-100 text-xs space-y-1">`;
            if (item.gains) detailsHtml += `<p class="text-emerald-700"><strong>Gain(s) :</strong> ${escapeHtml(item.gains)}</p>`;
            if (item.resultats) detailsHtml += `<p class="text-slate-500"><strong>Résultats clés :</strong> ${escapeHtml(item.resultats)}</p>`;
            detailsHtml += `</div>`;
          }
        } 
        else if (sheetTarget === "MeP") {
          if (item.chantier) badgesHtml += `<span class="px-2 py-0.5 bg-amber-50 text-amber-700 rounded">${escapeHtml(item.chantier)}</span>`;
          if (item.levier) badgesHtml += `<span class="px-2 py-0.5 bg-purple-50 text-purple-700 rounded">${escapeHtml(item.levier)}</span>`;
          
          if (item.livrables) {
            detailsHtml += `<div class="mt-2 pt-2 border-t border-slate-100 text-xs">`;
            detailsHtml += `<p class="text-slate-500"><strong>Livrables clés :</strong> ${escapeHtml(item.livrables)}</p>`;
            detailsHtml += `</div>`;
          }
        }

        return `
          <div draggable="true" ondragstart="handleDragStart(event, '${item.id}')" onclick="${!isSelected ? `selectItem('${item.id}')` : ''}" class="p-4 bg-white border border-slate-200 rounded-xl flex items-start justify-between gap-3 shadow-xs hover:shadow-md cursor-pointer">
            <div class="flex items-start gap-3 min-w-0 flex-1">
              ${isSelected ? `<span class="w-6 h-6 rounded-md bg-indigo-600 text-white font-bold text-xs flex items-center justify-center shrink-0">#${idx+1}</span>` : ''}
              <div class="space-y-1 min-w-0 flex-1">
                <div class="flex gap-1.5 flex-wrap text-xs mb-1">
                  ${badgesHtml}
                </div>
                <h3 class="font-bold text-slate-900">${escapeHtml(item.title)}</h3>
                <p class="text-xs text-slate-600 whitespace-pre-line">${escapeHtml(item.description)}</p>
                ${detailsHtml}
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              ${isSelected ? `
                <div class="flex flex-col gap-0.5">
                  <button onclick="event.stopPropagation(); movePriority('${item.id}', -1)" class="p-1 hover:bg-slate-100 rounded"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>
                  <button onclick="event.stopPropagation(); movePriority('${item.id}', 1)" class="p-1 hover:bg-slate-100 rounded"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>
                </div>
              ` : ''}
              <span class="px-2.5 py-1 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded-lg">Valeur Business: ${escapeHtml(item.businessNote)}</span>
              <span class="px-2.5 py-1 text-xs font-black bg-indigo-50 text-indigo-700 rounded-lg">${item.score} pts</span>
              ${isSelected ? `<button onclick="deselectItem('${item.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="minus-circle" class="w-5 h-5"></i></button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateGauge() {
      const score = getTotalSelectedScore();
      document.getElementById("score-counter").textContent = `${score} / ${maxScoreLimit} pts`;
      document.getElementById("progress-bar").style.width = `${Math.min(100, (score / maxScoreLimit) * 100)}%`;
    }

    function showAlert(msg) { document.getElementById("alert-message").textContent = msg; document.getElementById("alert-banner").classList.remove("hidden"); }
    function dismissAlert() { document.getElementById("alert-banner").classList.add("hidden"); }
    function showLoading(show) { document.getElementById("loading-overlay").className = show ? "fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex flex-col items-center justify-center text-white" : "hidden"; }
    function escapeHtml(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
